name: CI

on:
  workflow_call:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-console:
    name: cloudflare-console
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Install locked dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix cloudflare ci
      - name: Test and bundle read-only Worker
        run: |
          npm --prefix cloudflare test
          npm --prefix cloudflare run build
          npm --prefix cloudflare run test:runtime
          npm --prefix cloudflare run check

  issue-link:
    name: issue-link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require linked Issue or scoped Dependabot exception
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Prefer git over `gh pr diff` (GraphQL often fails with GITHUB_TOKEN on private repos).
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          export PR_FILES
          PR_FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          python scripts/check_pr_issue_link.py

  tests:
    name: test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build read-only console
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Unit tests
        run: uv run --no-sync pytest -q
      - name: CLI startup
        run: uv run --no-sync max-agent --help
      - name: Build wheel and sdist
        run: uv build
      - name: Verify console assets in wheel
        run: uv run --no-sync python scripts/check_console_package.py
      - name: Dependency lock audit
        run: uv run --no-sync python scripts/audit_dependencies.py

  staging-smoke:
    name: staging-smoke
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Staging smoke
        run: uv run --no-sync python scripts/staging_smoke.py
      - name: SQLite restore drill
        run: uv run --no-sync python scripts/restore_drill.py
