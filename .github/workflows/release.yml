name: Build and GitHub Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    name: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev --python 3.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build read-only console
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test tagged source
        run: uv run --no-sync pytest -q
      - name: Build distributions
        run: uv build
      - name: Verify console assets in wheel
        run: uv run --no-sync python scripts/check_console_package.py
      - name: Generate checksums and unsigned provenance
        run: uv run --no-sync python scripts/release_provenance.py --dist dist
      - name: Save release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: max-agent-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: github-release
    needs: verify-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: max-agent-distributions
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag "${release_flags[@]}"
