name: Deploy Cloudflare console

on:
  workflow_dispatch:

# Pre-activation: no automatic trigger, and deploy is hard-disabled below.
# Enabling requires a separately reviewed Git change after setup verification.

# Never run deployment code from a pull request or grant repository writes.
permissions:
  contents: read

concurrency:
  group: cloudflare-max-console
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Wike-CHI/max-agent' && github.ref == 'refs/heads/feat/53-cloudflare-console'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy-cloudflare-console
    needs: verify
    # Hard stop independent of current variables, credentials or manual inputs.
    # Remove the literal false only in the separately authorized activation commit.
    if: ${{ false && github.repository == 'Wike-CHI/max-agent' && github.ref == 'refs/heads/feat/53-cloudflare-console' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-max-console
      url: ${{ steps.verify.outputs.url }}
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Install and build without deployment credentials
        run: |
          npm --prefix frontend ci
          npm --prefix cloudflare ci
          npm --prefix cloudflare run build
          npm --prefix cloudflare run test:runtime
          npm --prefix cloudflare run check
          node cloudflare/scripts/provenance.mjs --check-deploy
      - name: Deploy only max-agent-console
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/max-console-deployment.jsonl
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing environment secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing environment variable CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          npm run deploy -- --tag "${GITHUB_SHA:0:12}" --message "Git ${GITHUB_SHA}; Actions ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
      - name: Verify live commit and record Worker version
        id: verify
        env:
          WRANGLER_DEPLOYMENT_OUTPUT: ${{ runner.temp }}/max-console-deployment.jsonl
        run: node cloudflare/scripts/verify-deployment.mjs
